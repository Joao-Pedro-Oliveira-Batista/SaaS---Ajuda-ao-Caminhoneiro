<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="inicio">
    <div class="container">

        <div class="conteudologin">
            <header>
                <h1>Bem-vindo de volta.</h1>
                <p>Faça login para acessar sua conta</p>
            </header>
            <main>
                <h2>Email</h2>
                <form>
                    <label></label>
                    <input class="preencher" type="email" name="email" id="emaillogin">
                </form>
                <h3>Senha</h3>
                <input class="preencher" type="email" name="" id="">

                <section class="ajuda">
                    <input class="botao" type="checkbox" name="lembrar" id="">
                    <label for="lembrar">Lembrar senha</label>


                    <p>Esqueci minha senha</p>
                </section>

                <button class="entrar">Entrar</button>

                <section class="login-extra">
                    <p>Ou contiue com</p>
                    <button class="google">Google</button>
                </section>

                <section class="final">
                    <p>Ainda não tem uma conta ? <a href="Cadastro.html">Criar conta</a></p>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
