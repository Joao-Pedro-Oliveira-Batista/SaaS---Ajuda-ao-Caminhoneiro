<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="inicio">
    <div class="container">

        <div class="conteudologin">
            <header>
                <h1>Bem-vindo de volta.</h1>
                <p>Faça login para acessar sua conta</p>
            </header>
            <main>
                <h2>Email</h2>
                <form method="post" autocomplete="on">
                    <div>
                        <label for="emaillogin"></label><br>
                        <input required class="preencher" type="email" name="emaillogin" id="emaillogin">
                    </div>
                </form>

                <h2>Senha</h2>
                <form method="post" autocomplete="on">
                    <label for="senhalogin"></label><br>
                    <input required class="preencher" type="text" name="senha" id="senhalogin">
                </form>

                <section>
                    <form>
                        <div class="ajudaformlogin">

                            <label class="checkbox" for="lembrarlogin">
                                <input type="checkbox" name="lembrar" id="lembrarlogin">
                                lembre-me
                            </label>

                            <p>Esqueci minha senha</p>
                        </div>
                    </form>
                </section>

                <button class="entrar">Entrar</button>

                <section class="login-extra">
                    <p>Ou contiue com</p>
                    <button class="google">Google</button>
                </section>

                <section class="final">
                    <p>Ainda não tem uma conta ? <a href="Cadastro.html">Criar conta</a></p>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
