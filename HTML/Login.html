<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="inicio">
    <div class="container">

        <div class="conteudologin">
            <header>
                <h1>Bem-vindo de volta.</h1>
                <p>Faça login para acessar sua conta</p>
            </header>
            <main>
                <form method="post" autocomplete="on">
                    <div class="campo2">
                        <label for="emaillogin">Email</label><br>
                        <input autocomplete="email" required class="preencher" type="email" name="emaillogin"
                            id="emaillogin">
                    </div>

                    <div class="campo2">
                        <label for="senhalogin">Senha</label><br>
                        <input required class="preencher" autocomplete="current-password" type="password" name="senha"
                            id="senhalogin">
                    </div>

                    <div class="ajudaformlogin">
                        <label class="checkbox" for="lembrarlogin">
                            <input type="checkbox" name="lembrar" id="lembrarlogin">
                            lembre-me
                        </label>
                        <p><a class="a-login" href="">Esqueci minha senha</a></p>
                    </div>
                </form>

                <button class="entrar">Entrar</button>

                <section class="login-extra">
                    <p>Ou contiue com</p>
                    <button class="google">Google</button>
                </section>

                <section class="final">
                    <p>Ainda não tem uma conta ? <a href="Cadastro.html">Criar conta</a></p>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
