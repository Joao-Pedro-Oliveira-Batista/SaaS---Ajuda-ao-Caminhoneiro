<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="bodyconfiguracao">
    <header class="cabecalhoconfiguracao">
        <h1><a class="a-configuracao" href="Dashboard.html">◀ </a></h1>
        <h2>Configuração</h2>
        <p>Gerencie as preferências <br> da sua conta</p>
    </header>
    <main>
        <section class="aparenciaconfig">
            <h2>Aparência</h2>
            <p>Tema</p>

            <form method="get">
                <div class="aparenciatemaconfig">
                    <input class="inputconfig" type="radio" name="tema" id="temaclaroconfig"> <label
                        class="labelconfig1" for="temaclaroconfig">Claro</label>

                    <input class="inputconfig" type="radio" name="tema" id="temaescuroconfig" checked> <label
                        class="labelconfig2" for="temaescuroconfig">Escuro</label>
                </div>
            </form>
        </section>

        <section class="notificacaoconfig">
            <h2>Notificações</h2>

            <div class="containernotifconfig">
                <label class="switch" for="notificacaocinfig">
                    <span class="switch-text">Receber notificação</span>
                    <div class="switch-wrapper">
                        <input type="checkbox" name="notificacao" id="notificacaocinfig">
                        <span class="switch-button"></span>
                    </div>
                </label>
            </div>
        </section>

        <section class="configconta">
            <h2>Conta</h2>
            <p>Alterar a senha</p>
            <p>Sair da conta</p>
        </section>
    </main>
</body>

</html>
