<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="inicio">

    <div class="container">

        <div class="conteudocadastro">
            <header>
                <h1>Cadastre-se</h1>
            </header>
            <main>
                <form method="post" autocomplete="on">
                    <label for="nomecadastro" class="Cadastrosubtitulo">Nome</label>
                    <input required autocomplete="name" class="preencher" type="text" name="nome" id="nomecadastro">
                </form>

                <form method="post" autocomplete="on">
                    <label for="emailcadastro" class="Cadastrosubtitulo">Email</label>
                    <input required autocomplete="email" class="preencher" type="text" name="email" id="emailcadastro">
                </form>

                <form method="post" autocomplete="on">
                    <label for="senhacadastro" class="Cadastrosubtitulo">Senha</label>
                    <input required autocomplete="new-password" class="preencher" type="text" name="senha"
                        id="senhacadastro">
                </form>

                <form method="post" autocomplete="on">
                    <label form="confirmarsenhacadastro" class="Cadastrosubtitulo">Confirmar senha</label>
                    <input minlength="8" required autocomplete="current-password" class="preencher" type="text"
                        name="confirmarsenha" id="confirmarsenhacadastro">
                </form>

                <section>
                    <button class="entrar"><a class="aentrar" href="Dashboard.html">Criar Conta</a></button>
                </section>

                <section class="login-extra">
                    <p>Ou contiue com</p>
                    <button class="google">Google</button>
                </section>

                <section class="finalcd">
                    Já tem uma conta ? <a href="Login.html">Entrar</a>
                </section>

            </main>
        </div>

    </div>
</body>

</html>
