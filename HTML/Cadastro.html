<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="inicio">

    <div class="container">

        <div class="conteudocadastro">
            <header>
                <h1>Cadastre-se</h1>
            </header>
            <main>
                <form method="post" autocomplete="on">
                    <div class="campocadastro">
                        <label for="nomecadastro">Nome</label><br>
                        <input required autocomplete="name" class="preencher" type="text" name="nome" id="nomecadastro">
                    </div>

                    <div class="campocadastro">
                        <label for="emailcadastro">Email</label><br>
                        <input required autocomplete="email" class="preencher" type="email" name="email"
                            id="emailcadastro">
                    </div>

                    <div class="campocadastro">
                        <label for="senhacadastro">Senha</label><br>
                        <input minlength="8" required autocomplete="new-password" class="preencher" type="password"
                            name="senha" id="senhacadastro">
                    </div>

                    <div class="campocadastro">
                        <label for="confirmarsenhacadastro">Confirmar senha</label><br>
                        <input minlength="8" required autocomplete="new-password" class="preencher" type="password"
                            name="confirmarsenha" id="confirmarsenhacadastro">
                    </div>

                    <button type="submit" class="entrar">Criar conta</button>
                </form>

                <section class="login-extra">
                    <p>Ou continue com</p>
                    <button type="button" class="google">Google</button>
                </section>

                <section class="finalcd">
                    Já tem uma conta? <a href="Login.html">Entrar</a>
                </section>

            </main>
        </div>

    </div>
</body>

</html>
