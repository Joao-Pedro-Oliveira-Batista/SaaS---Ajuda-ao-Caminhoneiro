<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar frete</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="bodyadicionarfrete">
    <header class="cabecalhofrete">
        <h1><a class="a-frete" href="Dashboard.html">◀ </a></h1>
        <p>Adicionar frete</p>
    </header>
    <main>
        <form method="post">
            <div class="campo">
                <label for="origemfrete">Origem</label><br>
                <input class="inputs" placeholder="Cidade de origem" required type="text" name="origem"
                    id="origemfrete">
            </div>

            <div class="campo">
                <label for="destinofrete">Destino</label><br>
                <input class="inputs" placeholder="Cidade de destino" required type="text" name="destino"
                    id="destinofrete">
            </div>

            <div class="campo">
                <label for="valorrecebidofrete">Valor recebido</label><br>
                <input class="inputs" min="0" step="0.01" inputmode="decimal" placeholder="R$ Adicionar valor" required
                    type="number" name="valorrecebido" id="valorrecebidofrete">
            </div>

            <div class="campo">
                <label for="kmrodadofrete">Km rodados</label><br>
                <input class="inputs" min="0" step="0.1" placeholder="Adicionar km rodados" required type="number"
                    name="kmrodado" id="kmrodadofrete">
            </div>

            <div class="campo">
                <label for="datafrete">Data</label><br>
                <input class="inputs" required type="date" name="data" id="datafrete">
            </div>

            <div class="campo">
                <label for="observacaofrete">Observação (opcional)</label>
                <textarea name="observacao" id="observacaofrete" cols="30" rows="10"></textarea>
            </div>

            <p class="estilopfrete">Esse valor será adicionado<br> a receita do mês</p>

            <section class="butaosalvarfrete">
                <button type="submit" class="butaofrete">Salvar Frete</button>
            </section>
        </form>
    </main>
</body>

</html>
