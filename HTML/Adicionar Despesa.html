<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionando despesas</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body class="bodyadicioandodespesas">
    <header class="cabeçalhoadicionandodespesas">
        <h1><a class="a-despesa" href="Dashboard.html">◀ </a></h1>
        <p>Adicionar Despesa</p>
    </header>
    <main class="adicionandodespesas">

        <form method="post" autocomplete="on">
            <div class="campo">
                <label for="categoriadespesa">Categoria</label><br>
                <input class="inputs" placeholder="Digite ou selecione uma categoria" required type="text"
                    name="categoria" id="categoriadespesa" list="escolhadeacategoriadespesa" autocomplete="on">

                <datalist id="escolhadeacategoriadespesa">
                    <option>Combustível</option>
                    <option>Pedágio</option>
                    <option>Alimentação</option>
                    <option>Óleo</option>
                    <option>Mecânica</option>
                    <option>Pneus</option>
                    <option>Lavagem</option>
                    <option>Estacionamento</option>
                    <option>Hospedagem</option>

                </datalist>
            </div>

            <div class="campo">
                <label for="valordespesa">Valor</label><br>
                <input class="inputs" required step="0.01" min="0" inputmode="decimal"
                    placeholder=" R$ - Adicionar o valor" type="number" name="valor" id="valordespesa">
            </div>

            <div class="campo">
                <label for="datadespesa">Data</label><br>
                <input class="inputs" required type="date" name="data" id="datadespesa">
            </div>


            <div class="campo">
                <label for="observacaodespesa">Observação (Opcional)</label><br>
                <textarea name="observacao" id="observacaodespesa" cols="30" rows="10"></textarea>
            </div>

            <br>
            <br>
            <p class="estilopdespesa2">Essa despesa será descontada<br> do lucro do mês</p>

            <section class="butaosalvardespesa">
                <button type="submit" class="butaodespesa">Salvar Despesa</button>
            </section>
        </form>
    </main>
</body>


</html>
